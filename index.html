<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#233127">
<title>旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="journal.css">
</head>
<body>
<div class="app" id="app">
  <div class="loading">載入中…</div>
</div>

<form class="gate" id="gate" hidden>
  <div class="gate-box">
    <p class="eyebrow">Travel Journal</p>
    <h1>旅行手帳</h1>
    <p class="gate-msg" id="gate-msg">輸入通關密語</p>
    <input type="password" id="gate-input" autocomplete="current-password" placeholder="通關密語" required>
    <button class="btn" type="submit">進入</button>
  </div>
</form>

<script src="journal.js"></script>
</body>
</html>
